# Fabrique l'application Windows (.exe) et Mac (.dmg) sur les serveurs de GitHub, gratuitement.
#  • À chaque push sur main : fichiers téléchargeables dans l'onglet « Actions » (artifacts).
#  • Quand tu crées un tag v… (ex. v0.3.0) : une page « Release » avec les liens publics à partager.
name: Construire l'application

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests -v

  construire:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, pkg: node20-win-x64, ext: .exe, nom: Windows }
          - { os: macos-latest, pkg: node20-macos-arm64, ext: "", nom: Mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Pont WhatsApp → un seul exécutable
        shell: bash
        run: |
          cd pont_whatsapp
          npm install --omit=dev --no-audit --no-fund
          npx --yes @yao-pkg/pkg pont.cjs -t ${{ matrix.pkg }} -o ../build/pont/pont-whatsapp${{ matrix.ext }}

      - name: Tests sur ce système (Windows / Mac)
        shell: bash
        run: |
          pip install -r requirements.txt pyinstaller pillow
          set +e
          python -m unittest discover tests -v > resultat_tests.txt 2>&1
          code=$?
          python -c "import agent_student.orchestrateur, agent_student.app.fenetre; print('imports ok')" >> resultat_tests.txt 2>&1 || code=1
          tail -n 60 resultat_tests.txt
          if [ $code -ne 0 ]; then
            echo "::error title=Tests ${{ runner.os }}::$(grep -v '^\[' resultat_tests.txt | tail -n 40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
            exit 1
          fi

      - name: Application
        shell: bash
        run: pyinstaller --noconfirm agent_student.spec

      - name: Emballage Windows
        if: runner.os == 'Windows'
        shell: bash
        run: mkdir -p livraison && cp dist/AgentStudent.exe livraison/AgentStudent-Windows.exe

      - name: Emballage Mac (.dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p livraison dmg
          cp -R "dist/Agent Student.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Agent Student" -srcfolder dmg -ov -format UDZO livraison/AgentStudent-Mac.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: AgentStudent-${{ matrix.nom }}
          path: livraison/*

      - name: Publier la version (page Releases, liens à partager)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.3.2' }}
          name: Agent Student ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.3.2' }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: livraison/*
          body: |
            **Windows** : télécharge `AgentStudent-Windows.exe` et double-clique.
            Si Windows affiche « Windows a protégé votre ordinateur » → *Informations complémentaires* → *Exécuter quand même*.

            **Mac (Apple Silicon)** : ouvre `AgentStudent-Mac.dmg`, glisse l'app dans *Applications*.
            Au 1er lancement : clic droit sur l'app → *Ouvrir* → *Ouvrir*.
